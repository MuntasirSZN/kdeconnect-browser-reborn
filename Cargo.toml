[package]
name = "kdeconnect-browser-extension"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Native messaging host bridging Chrome/Firefox with KDE Connect via D-Bus"
repository = "https://github.com/MuntasirSZN/kdeconnect-chrome-extension"
license = "MIT"

[features]
default = ["ts-export"]
ts-export = ["dep:ts-rs"]

[dependencies]
anyhow = "1"
byteorder = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
inquire = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "sync"] }
tracing = "0.1"
tracing-appender = { version = "0.2.5", features = ["parking_lot"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", default-features = false, features = ["serde-compat", "serde-json-impl"], optional = true }
zbus = "6"
