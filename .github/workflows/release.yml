name: release

on:
  push:
    tags: ["v*"]

# Release builds: 3 OS × 2 arches = 6 binaries, all built with cargo-zigbuild.
permissions: {}

jobs:
  build:
    name: "release ${{ matrix.target }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
          - os: macos-26-intel
            arch: x86_64
            target: x86_64-apple-darwin
          - os: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - os: windows-11-vs2026-arm
            arch: aarch64
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild
      - name: Install zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
      - name: Build
        run: >
          cargo zigbuild --release
          --target ${{ matrix.target }}${{ (matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-26.04-arm') && '.2.17' || '' }}
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kdeconnect-browser-reborn-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/kdeconnect-browser-reborn*
          retention-days: 1

  extension:
    name: "Extension zips"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Zip the extension
        # Produces .output/extension-<version>-chrome.zip and
        # .output/extension-<version>-firefox.zip for the browsers.
        run: bun run zip
      - name: Upload zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zips
          path: extension/.output/*.zip
          if-no-files-found: error

  release:
    name: "Create GitHub release for ${{ github.ref_name }}"
    needs: [build, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: Create release
        run: >
          gh release create ${GITHUB_REF_NAME}
          --title "KDE Connect Browser Reborn ${GITHUB_REF_NAME}"
          --notes "Binaries built with cargo-zigbuild: Linux, macOS and Windows, x86_64 and aarch64, plus browser extension zips."
      - name: Upload assets
        run: >
          gh release upload ${GITHUB_REF_NAME}
          $(find . -type f \( -path '*/kdeconnect-browser-reborn*' -o -path '*/extension-zips/*.zip' \) | sort)
